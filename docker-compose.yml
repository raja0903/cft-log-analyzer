version: "3.9"

services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-analyzer-app
    ports:
      - "5001:5000"
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5      

        #    depends_on:
        #      ollama:
        #        condition: service_healthy


  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama-service
    ports:
      - "11434:11434"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5        
    volumes:
      - ollama-data:/home/amj/.ollama

volumes:
  ollama-data:        
networks:
  app-network:
