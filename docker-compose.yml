version: "3.9"

services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-analyzer-app
    ports:
      - "5001:5000"
    env_file:
      - .env
    networks:
      - app-network

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama-service
    ports:
      - "11434:11434"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network

networks:
  app-network:
