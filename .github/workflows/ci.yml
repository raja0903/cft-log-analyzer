name: CI - Docker Compose App

on:
  push:
    branches:
      - docker-setup

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

        # - name: Verify Docker
        #      run: docker --version

    - name: Stop Current Docker
      run: docker compose down

    - name: Build and start services
      run: docker compose up -d --build

        #- name: Wait for services to start
    - name: Wait for Flask to be healthy
      run: |
        for i in {1..10}; do
          if curl -f http://localhost:5001; then
            echo "Flask is ready"
            exit 0
          fi
          echo "Waiting..."
        done
        exit 1
    #      run: sleep 20

    - name: Check running containers
      run: docker ps

    - name: Test Flask App
      run: curl -f http://localhost:5001 || exit 1

